services:
  - type: web
    name: veil-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: veil-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://veil-frontend-wine.vercel.app
      - key: CORS_ORIGINS
        value: https://veil-frontend-wine.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
databases:
  - name: veil-postgres
    databaseName: veil
    user: veil
