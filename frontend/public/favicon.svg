<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#07131b"/>
  <!-- Radar web lines -->
  <g stroke="#17313f" stroke-width="0.6" opacity="0.8">
    <line x1="32" y1="4" x2="32" y2="60"/>
    <line x1="4" y1="32" x2="60" y2="32"/>
    <line x1="10" y1="10" x2="54" y2="54"/>
    <line x1="54" y1="10" x2="10" y2="54"/>
    <ellipse cx="32" cy="32" rx="14" ry="14"/>
    <ellipse cx="32" cy="32" rx="22" ry="22"/>
  </g>
  <!-- Eye outline (almond shape) -->
  <path d="M8 32 Q32 8 56 32 Q32 56 8 32 Z" stroke="#4fc1d8" stroke-width="2.2" fill="none"/>
  <!-- Inner iris circle -->
  <circle cx="32" cy="32" r="10" stroke="#4fc1d8" stroke-width="1.4" fill="none" opacity="0.6"/>
  <!-- Hexagon pupil -->
  <polygon points="32,22 40.66,27 40.66,37 32,42 23.34,37 23.34,27" fill="#4fc1d8" opacity="0.15" stroke="#7ee8f7" stroke-width="1.6"/>
  <polygon points="32,25.5 37.8,28.75 37.8,35.25 32,38.5 26.2,35.25 26.2,28.75" fill="#4fc1d8" opacity="0.85"/>
  <!-- Highlight dot -->
  <circle cx="35" cy="29" r="1.5" fill="#b0f0fb" opacity="0.7"/>
</svg>
